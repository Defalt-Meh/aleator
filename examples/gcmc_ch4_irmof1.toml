# Grand-canonical Monte Carlo: methane adsorption in IRMOF-1 (MOF-5), 298 K, 0.1 bar.
#
# Structure and force field are real, published data (see
# tests/validation/data/irmof1/PROVENANCE.md for exact sources): the CIF is
# RASPA2's bundled IRMOF-1 structure (Eddaoudi et al., Science 2002), and the
# Lennard-Jones parameters are RASPA2's "GenericMOFs" UFF-derived framework
# terms plus a TraPPE-style united-atom methane adsorbate.
#
# This is not a shortened smoke test: `rng_seed`, `pressure_bar`, and the
# step counts below are IDENTICAL to
# tests/validation/test_gcmc_ch4_irmof1_isotherm.cc's real 0.1 bar point, and
# the CLI's production loop samples <N> the same way that test does (every
# step, not once per progress update) -- so `aleator gcmc run` on this file
# reproduces that test's <N> and loading numbers exactly (same seed, same
# deterministic RNG stream -- CLAUDE.md invariant #5), not just
# approximately. tests/integration/test_cli_end_to_end.cc checks this. Now
# affordable to run for real (rather than shortened) thanks to CLAUDE.md
# section 5's performance milestone: ~1 s on this codebase's post-optimization
# GCMC engine.

[run]
name = "ch4-irmof1-0.1bar"
output_directory = "out"
rng_seed = 2026
thread_count = 1

[gcmc]
framework_cif = "IRMOF-1.cif"
temperature_kelvin = 298.0
pressure_bar = 0.1
cutoff_angstrom = 12.0
equilibration_steps = 30000
production_steps = 90000

[gcmc.adsorbate]
name = "CH4"
epsilon_kelvin = 158.5
sigma_angstrom = 3.72
mass_amu = 16.04246
# Optional: Peng-Robinson critical properties. If omitted entirely, the CLI
# falls back to the ideal-gas approximation (fugacity = pressure) instead of
# guessing a species. Methane's real values (NIST/CODATA-consistent):
critical_temperature_kelvin = 190.6
critical_pressure_pascal = 4.599e6
acentric_factor = 0.011

[[gcmc.framework_lj]]
element = "Zn"
epsilon_kelvin = 62.3992
sigma_angstrom = 2.46155

[[gcmc.framework_lj]]
element = "O"
epsilon_kelvin = 48.1581
sigma_angstrom = 3.03315

[[gcmc.framework_lj]]
element = "C"
epsilon_kelvin = 47.8562
sigma_angstrom = 3.47299

[[gcmc.framework_lj]]
element = "H"
epsilon_kelvin = 7.64893
sigma_angstrom = 2.84642
