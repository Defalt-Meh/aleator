name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc13
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - name: ubuntu-clang16
            os: ubuntu-24.04
            cc: clang-16
            cxx: clang++-16
          - name: macos-clang
            os: macos-14
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-2022
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} ${{ matrix.cxx == 'g++-13' && 'g++-13' || 'clang-16' }} ninja-build autoconf autoconf-archive automake libtool

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        uses: seanmiddleditch/gha-setup-ninja@master
        if: runner.os == 'Windows'

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: bash
        run: bash scripts/bootstrap_vcpkg.sh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-cibw

      - name: Configure (dev preset)
        shell: bash
        run: cmake --preset dev
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-cibw

      - name: Build
        run: cmake --build --preset dev

      - name: Check test discovery (CLAUDE.md invariant 8)
        shell: bash
        run: python3 scripts/check_test_discovery.py --build-dir build/dev --tests-dir tests

      - name: Test
        run: ctest --preset dev -LE known-deviation

      - name: Test (known-deviation, reported separately -- CLAUDE.md section 4)
        run: ctest --preset dev -L known-deviation

      - name: Upload benchmark baseline artifact
        if: matrix.name == 'ubuntu-gcc13'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          if-no-files-found: ignore

  sanitizers:
    name: asan-ubsan (Linux, Clang)
    runs-on: ubuntu-24.04
    env:
      CC: clang-16
      CXX: clang++-16
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 ninja-build autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        run: bash scripts/bootstrap_vcpkg.sh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-cibw

      - name: Configure (asan preset)
        run: cmake --preset asan
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-cibw

      - name: Build
        run: cmake --build --preset asan

      - name: Test under ASan + UBSan
        run: ctest --preset asan

  system-packages:
    name: system-packages (Ubuntu, apt, no vcpkg)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md portability contract: "The build must not hard-require
      # vcpkg... a contributor who cannot bootstrap vcpkg must still be
      # able to build and run the tests." This job proves it: no
      # VCPKG_ROOT is ever set, every dependency comes from apt, and
      # configure uses the 'system' preset (no toolchainFile). Package
      # names/versions verified against Ubuntu 24.04 (noble)'s real
      # package index, not assumed:
      #   libhwy-dev 1.0.7, catch2 3.4.0, libspdlog-dev 1.12.0,
      #   libbenchmark-dev 1.8.3, libtomlplusplus-dev 3.4.0.
      - name: Install compiler and dependencies from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 ninja-build \
            libhwy-dev catch2 libspdlog-dev libbenchmark-dev libtomlplusplus-dev libfmt-dev

      - name: Configure (system preset, no VCPKG_ROOT)
        run: cmake --preset system

      - name: Build
        run: cmake --build --preset system

      - name: Check test discovery (CLAUDE.md invariant 8)
        run: python3 scripts/check_test_discovery.py --build-dir build/system --tests-dir tests

      - name: Test
        run: ctest --preset system -LE known-deviation

  wheels:
    name: wheels (${{ matrix.os }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
